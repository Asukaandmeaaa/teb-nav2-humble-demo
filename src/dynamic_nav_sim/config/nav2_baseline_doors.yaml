bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: true
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    default_nav_to_pose_bt_xml: ''
bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    odom_topic: /odom
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.2
    FollowPath:
      plugin: teb_local_planner::TebLocalPlannerROS
      odom_topic: /odom
      teb_autosize: 1.0
      dt_ref: 0.3
      dt_hysteresis: 0.1
      max_samples: 500
      global_plan_overwrite_orientation: false
      allow_init_with_backwards_motion: true
      max_global_plan_lookahead_dist: 3.0
      global_plan_viapoint_sep: 0.12
      global_plan_prune_distance: 1.0
      exact_arc_length: false
      feasibility_check_no_poses: 5
      feasibility_check_lookahead_distance: 1.5
      publish_feedback: true
      max_vel_x: 0.3
      max_vel_y: 0.0
      max_vel_theta: 0.8
      acc_lim_x: 0.4
      acc_lim_y: 0.2
      acc_lim_theta: 1.2
      footprint_model:
        type: polygon
        vertices: '[[-0.32, -0.28], [0.32, -0.28], [0.32, 0.28], [-0.32, 0.28]]'
      free_goal_vel: false
      min_obstacle_dist: 0.04
      inflation_dist: 0.08
      include_costmap_obstacles: true
      costmap_obstacles_behind_robot_dist: 1.0
      obstacle_poses_affected: 15
      dynamic_obstacle_inflation_dist: 0.5
      include_dynamic_obstacles: true
      no_inner_iterations: 4
      no_outer_iterations: 4
      optimization_activate: true
      optimization_verbose: false
      penalty_epsilon: 0.01
      obstacle_cost_exponent: 1.0
      weight_max_vel_x: 20.0
      weight_max_vel_theta: 10.0
      weight_acc_lim_x: 10.0
      weight_acc_lim_theta: 10.0
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 10.0
      weight_kinematics_turning_radius: 1.0
      weight_optimaltime: 1.0
      weight_shortest_path: 0.0
      weight_obstacle: 500.0
      weight_inflation: 0.4
      weight_dynamic_obstacle: 400.0
      weight_dynamic_obstacle_inflation: 2.0
      weight_viapoint: 15.0
      weight_adapt_factor: 2.0
      enable_homotopy_class_planning: true
      enable_multithreading: true
      max_number_classes: 4
      selection_cost_hysteresis: 5.0
      selection_prefer_initial_plan: 1.0
      selection_obst_cost_scale: 1.0
      selection_alternative_time_cost: true
      roadmap_graph_no_samples: 15
      roadmap_graph_area_width: 5.0
      roadmap_graph_area_length_scale: 1.0
      h_signature_prescaler: 0.5
      h_signature_threshold: 0.1
      obstacle_heading_threshold: 0.45
      switching_blocking_period: 0.0
      viapoints_all_candidates: true
      delete_detours_backwards: true
      max_ratio_detours_duration_best_duration: 3.0
      visualize_hc_graph: false
      visualize_with_time_as_z_axis_scale: 0.0
      shrink_horizon_backup: true
      shrink_horizon_min_duration: 10.0
      oscillation_recovery: true
      oscillation_v_eps: 0.1
      oscillation_omega_eps: 0.1
      oscillation_recovery_min_duration: 10.0
      oscillation_filter_duration: 10.0
      max_vel_x_backwards: 0.15
      obstacle_association_force_inclusion_factor: 5.0
      obstacle_association_cutoff_factor: 30.0
      weight_velocity_obstacle_ratio: 5.0
      use_proportional_saturation: true
      control_look_ahead_poses: 1
      obstacle_proximity_lower_bound: 0.0
      obstacle_proximity_upper_bound: 0.25
controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.02
      footprint: '[[-0.32, -0.28], [0.32, -0.28], [0.32, 0.28], [-0.32, 0.28]]'
      plugins:
      - obstacle_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.45
        cost_scaling_factor: 5.0
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.08
          obstacle_max_range: 11.5
          obstacle_min_range: 0.08
          inf_is_valid: true
          observation_persistence: 0.0
      always_send_full_costmap: true
      footprint_padding: 0.0
  local_costmap_client:
    ros__parameters:
      use_sim_time: true
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: true
      footprint: '[[-0.32, -0.28], [0.32, -0.28], [0.32, 0.28], [-0.32, 0.28]]'
      resolution: 0.025
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 5.0
        inflation_radius: 0.45
      always_send_full_costmap: true
      footprint_padding: 0.015
      rolling_window: true
      width: 84
      height: 16
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.08
          obstacle_max_range: 11.5
          obstacle_min_range: 0.08
          inf_is_valid: true
          observation_persistence: 0.0
        combination_method: 0
  global_costmap_client:
    ros__parameters:
      use_sim_time: true
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    use_sim_time: true
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.15
      allow_unknown: true
      downsample_costmap: false
      angle_quantization_bins: 72
      motion_model_for_search: DUBIN
      minimum_turning_radius: 0.4
      smooth_path: false
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 40.0
      cost_penalty: 1.5
      cache_obstacle_heuristic: false
      max_iterations: 4000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      lookup_table_size: 20.0
planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 40.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity:
    - 0.3
    - 0.0
    - 0.8
    min_velocity:
    - -0.15
    - 0.0
    - -0.8
    max_accel:
    - 0.4
    - 0.0
    - 1.2
    max_decel:
    - -0.6
    - 0.0
    - -1.8
    odom_topic: odom
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
robot_state_publisher:
  ros__parameters:
    use_sim_time: true
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_footprint
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    behavior_plugins:
    - spin
    - backup
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
